name: Acess macOS 15

on:
  workflow_dispatch: # Inicia manualmente pelo botão na aba Actions

jobs:
  macos-desktop:
    runs-on: macos-15 # Usa a VM com macOS 15 Sequoia

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Senha do Usuário e VNC Nativo
        run: |
          # Define a senha do usuário runner para '123456'
          echo "runner:123456" | sudo chpasswd
          
          # Ativa o serviço de Screen Sharing / VNC nativo do macOS
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw 123456 \
            -restart -agent -privs -all

      - name: Instalar e Configurar ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Instala o ngrok via Homebrew no macOS
          brew install ngrok/ngrok/ngrok
          ngrok config add-authtoken $NGROK_TOKEN
          
          # Inicia o túnel TCP apontando para a porta do VNC nativo (5900)
          ngrok tcp 5900
