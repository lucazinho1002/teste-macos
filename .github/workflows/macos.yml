name: Acessar Interface macOS 15

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: macos-15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Senha e VNC Nativo
        run: |
          sudo sysadminctl -resetPasswordFor runner -newPassword "123456"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw 123456 \
            -restart -agent -privs -all

      - name: Instalar noVNC e Iniciar Túnel Cloudflare
        run: |
          python3 -m pip install websockify --break-system-packages
          git clone https://github.com/novnc/noVNC.git ~/noVNC
          
          # Inicia a ponte noVNC
          websockify --web ~/noVNC 6080 localhost:5900 &
          sleep 3
          
          # Instala o Cloudflare Tunnel
          brew install cloudflared
          
          # Gera um link público instantâneo e sem limite de 60 minutos
          cloudflared tunnel --url http://localhost:6080
