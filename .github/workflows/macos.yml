name: Acessar Interface macOS 15

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: macos-15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Senha e VNC Nativo
        run: |
          # Altera a senha do runner sem pedir a antiga
          sudo sysadminctl -resetPasswordFor runner -newPassword "123456"
          
          # Ativa o VNC nativo do macOS na porta 5900
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw 123456 \
            -restart -agent -privs -all

      - name: Instalar noVNC e ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Instala ferramentas de conversão VNC-para-Web
          brew install novnc ngrok/ngrok/ngrok
          
          ngrok config add-authtoken $NGROK_TOKEN
          
          # Transforma o VNC da porta 5900 em uma interface web na porta 6080
          websockify --web /opt/homebrew/Cellar/novnc/*/libexec 6080 localhost:5900 &
          
          # Cria o túnel HTTP público (funciona no plano grátis do ngrok sem cartão)
          ngrok http 6080
